- 0.0
- 1.0
XRAY2_MEAN_STD:
- 0.0
- 1.0
XRAY1_MIN_MAX:
- 0
- 255
XRAY2_MIN_MAX:
- 0
- 255
CT_MIN_MAX:
- -2000
- 4000
NETWORK:
  input_nc_D: 1
  input_nc_G: 512
  output_nc_G: 1
  no_dropout: true
  n_downsampling: 4
  n_blocks: 1
  ngf: 64
  ndf: 64
  which_model_netG: multiview_network_denseUNetFuse_transposed
  which_model_netD: basic3d
  norm_D: instance3d
  norm_G: instance3d
  ganloss: lsgan
  num_D: 3
  activation_type: relu
  n_out_ChannelsD: 1
  conditional_D: true
  map_input_nc_D: 1
  map_ndf: 64
  map_which_model_netD: multi2d
  map_n_layers_D: 3
  map_norm_D: instance
  map_pool_size: 50
  map_num_D: 3
  map_n_out_ChannelsD: 1
TRAIN:
  print_freq: 10
  save_epoch_freq: 10
  save_latest_freq: 1000
  print_img_freq: 500
  niter: 500
  niter_decay: 500
  beta1: 0.5
  beta2: 0.99
  lr: 5.0e-05
  batch_size: 1
  weight_decay_if: false
  nThreads: 2
CTGAN:
  Xray1_Direction: HDW
  Xray2_Direction: WDH
  CTOrder:
  - 0
  - 1
  - 2
  - 3
  - 4
  CTOrder_Xray1:
  - 0
  - 1
  - 3
  - 2
  - 4
  CTOrder_Xray2:
  - 0
  - 1
  - 4
  - 2
  - 3
  idt_lambda: 10.0
  idt_reduction: mean
  idt_weight: 0.0
  idt_weight_range:
  - 0.0
  - 1.0
  idt_loss: mse
  feature_D_lambda: 0.0
  map_projection_lambda: 0.0
  map_projection_loss: l1
  gan_lambda: 0.0
  auxiliary_loss: mse
  auxiliary_lambda: 0.0
TD_GAN:
  idt_lambda: 1.0
  restruction_loss: mse
  fea_m_lambda: 10.0
  map_m_lambda: 0.0
  map_m_type: l1
  fea_m_map_lambda: 10.0
  discriminator_feature: false
  critic_times: 1
D3_GAN:
  noise_len: 1000
  input_shape:
  - 4
  - 4
  - 4
  output_shape:
  - 128
  - 128
  - 128
  encoder_input_shape:
  - 128
  - 128
  encoder_input_nc: 1
  encoder_norm: instance
  multi_view:
  - 1
  - 2
  - 3
  min_max_norm: true
  dblu:
  - 0.0
  - 1.0
  - 1.0
  encoder_blocks: 3
DIFFUSION:
  diffusion_weight_decay: 0.0001
  diffusion_cfg_scale: 1.8
  diffusion_cond_drop_prob: 0.2
  diffusion_noise_schedule: cosine
  diffusion_structure_lambda: 0.0
  diffusion_projection_lambda: 0.0
  diffusion_intensity_lambda: 0.0
  diffusion_detail_lambda: 0.0
  diffusion_timesteps: 1000
  diffusion_beta_start: 0.0001
  diffusion_beta_end: 0.02
  diffusion_latent_channels: 128
  diffusion_cond_channels: 128
  diffusion_noise_lambda: 0.0
  diffusion_recon_lambda: 2.6
  diffusion_ae_lambda: 0.0
  diffusion_sample_steps: 300
  diffusion_ddim_eta: 0.0
  diffusion_use_ema: true
  diffusion_ema_decay: 0.9997
  diffusion_cond_encoder_type: vit
  diffusion_view_fusion: backprojection
  diffusion_view_pos_encoding: none
  diffusion_backproject_angle_span: 180.0
  diffusion_backproject_angle_offset: 0.0
  diffusion_aux_loss_mode: all
  diffusion_aux_t_max_ratio: 1.0
  diffusion_aux_snr_gamma: 5.0
  diffusion_sample_uncond: false
  diffusion_vit_depth: 1
  diffusion_vit_heads: 4
  diffusion_vit_mlp_ratio: 4.0
  diffusion_vit_dropout: 0.0
  diffusion_projection_protocol: disabled
  diffusion_require_geometry: false
  diffusion_freeze_autoencoder: false
  diffusion_autoencoder_checkpoint: ''
  drr_num_views: 2
  drr_uploaded_mode: true
  drr_undo_display_flip: true
  drr_uniform_angles: true
  drr_input_type: orthogonal_ap_lateral_drr_from_uploaded
  diffusion_separable_cond: false
  diffusion_separable_denoiser: false
  diffusion_condition_lifting: adaptive_pyramid
  diffusion_cuda_memory_fraction: 0.35
  diffusion_convolution_scope: all_standard
  diffusion_condition_detail: none
  diffusion_denoiser_type: residual
  drr_geometry_mode: ''
DATA_AUG:
  select_slice_num: 0
  fine_size: 128
  ct_channel: 128
  xray_channel: 1
